[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-workflows"
version = "0.1.0"
description = "Reusable single-cell analysis workflows"
requires-python = ">=3.11"
dependencies = [
    "scanpy",
    "anndata",
]

[tool.setuptools.packages.find]
where = ["src"]